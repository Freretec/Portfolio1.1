<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const container = document.getElementById('hero-canvas');
  let W = container.clientWidth, H = container.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
  camera.position.set(0, 0, 9);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  container.appendChild(renderer.domElement);

  const accent = new THREE.Color(0xFF6FA5);
  const inkColor = new THREE.Color(0xF2EAF6);
  const plum = new THREE.Color(0x2A1C35);

  scene.add(new THREE.AmbientLight(0x2A1C35, 1.2));
  const key = new THREE.PointLight(0xFF6FA5, 3.2, 30);
  key.position.set(4, 5, 6);
  scene.add(key);
  const rim = new THREE.PointLight(0xF2EAF6, 1.4, 30);
  rim.position.set(-5, -3, -4);
  scene.add(rim);

  const group = new THREE.Group();
  scene.add(group);

  const geoms = [
    new THREE.IcosahedronGeometry(1, 0),
    new THREE.OctahedronGeometry(0.9, 0),
    new THREE.TorusGeometry(0.7, 0.22, 16, 60),
    new THREE.TetrahedronGeometry(0.85, 0),
    new THREE.BoxGeometry(1.1,1.1,1.1),
    new THREE.DodecahedronGeometry(0.8, 0)
  ];

  const meshes = [];
  const count = 9;
  for(let i=0;i<count;i++){
    const geo = geoms[i % geoms.length];
    const isAccent = i % 3 === 0;
    const mat = new THREE.MeshStandardMaterial({
      color: isAccent ? accent : plum,
      metalness: 0.35,
      roughness: 0.35,
      emissive: isAccent ? accent : 0x000000,
      emissiveIntensity: isAccent ? 0.18 : 0,
      wireframe: i % 4 === 1
    });
    const mesh = new THREE.Mesh(geo, mat);
    const radius = 2.4 + Math.random()*1.6;
    const theta = (i / count) * Math.PI * 2;
    mesh.position.set(
      Math.cos(theta) * radius,
      (Math.random()-0.5) * 3.2,
      Math.sin(theta) * radius * 0.6
    );
    const scale = 0.35 + Math.random()*0.4;
    mesh.scale.setScalar(scale);
    mesh.userData = {
      speed: 0.2 + Math.random()*0.4,
      axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
      floatOffset: Math.random()*Math.PI*2,
      baseY: mesh.position.y
    };
    group.add(mesh);
    meshes.push(mesh);
  }

  // thin edge lines connecting nodes for a "network" feel
  const lineMat = new THREE.LineBasicMaterial({color:0xF2EAF6, transparent:true, opacity:0.08});
  for(let i=0;i<meshes.length;i++){
    const a = meshes[i];
    const b = meshes[(i+2)%meshes.length];
    const geo = new THREE.BufferGeometry().setFromPoints([a.position.clone(), b.position.clone()]);
    scene.add(new THREE.Line(geo, lineMat));
  }

  // particle dust
  const dustCount = 200;
  const dustGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(dustCount*3);
  for(let i=0;i<dustCount;i++){
    positions[i*3] = (Math.random()-0.5)*14;
    positions[i*3+1] = (Math.random()-0.5)*8;
    positions[i*3+2] = (Math.random()-0.5)*8 - 2;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const dustMat = new THREE.PointsMaterial({color:0xFF6FA5, size:0.02, transparent:true, opacity:0.6});
  const dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  // pointer interaction (drag to orbit, no pointer lock)
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let targetRotX = 0, targetRotY = 0;
  let currentRotX = 0, currentRotY = 0;

  container.addEventListener('pointerdown', (e)=>{
    isDragging = true;
    prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('pointerup', ()=>{ isDragging = false; });
  window.addEventListener('pointermove', (e)=>{
    if(!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    targetRotY += dx * 0.005;
    targetRotX += dy * 0.005;
    targetRotX = Math.max(-0.6, Math.min(0.6, targetRotX));
  });

  // gentle auto-parallax on mousemove within cell when not dragging
  container.addEventListener('mousemove', (e)=>{
    if(isDragging) return;
    const rect = container.getBoundingClientRect();
    const nx = (e.clientX - rect.left) / rect.width - 0.5;
    const ny = (e.clientY - rect.top) / rect.height - 0.5;
    targetRotY = nx * 0.4;
    targetRotX = ny * 0.25;
  });

  function resize(){
    W = container.clientWidth; H = container.clientHeight;
    if(W === 0 || H === 0) return;
    camera.aspect = W/H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }
  window.addEventListener('resize', resize);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    currentRotX += (targetRotX - currentRotX) * 0.06;
    currentRotY += (targetRotY - currentRotY) * 0.06;
    group.rotation.x = currentRotX;
    group.rotation.y = currentRotY + t * 0.05;

    meshes.forEach(m=>{
      m.rotation.x += 0.004 * m.userData.speed * 5 * 0.02;
      m.rotation.y += 0.006 * m.userData.speed * 5 * 0.02;
      m.position.y = m.userData.baseY + Math.sin(t * m.userData.speed + m.userData.floatOffset) * 0.3;
    });

    dust.rotation.y = t * 0.02;

    renderer.render(scene, camera);
  }
  animate();

  // handle case where container size becomes available after layout
  setTimeout(resize, 50);
})();
</script>

<script>
  // smooth-ish anchor behavior + active dock state on scroll into view
  const dockLinks = document.querySelectorAll('.dock a');
  const targets = ['blog','design','video','podcasts'].map(id=>document.querySelector(`[href="#${id}"]`) ? id : id);

  const sectionMap = {
    blog: document.querySelector('.cell-blog'),
    design: document.querySelector('.cell-design'),
    video: document.querySelector('.cell-video'),
    podcasts: document.querySelector('#podcasts')
  };

  window.addEventListener('scroll', ()=>{
    let current = 'blog';
    Object.entries(sectionMap).forEach(([key, el])=>{
      if(!el) return;
      const rect = el.getBoundingClientRect();
      if(rect.top < window.innerHeight*0.6){
        current = key;
      }
    });
    dockLinks.forEach(a=>{
      a.classList.toggle('active', a.getAttribute('href') === '#'+current);
    });
  });
</script>

</body>
</html>
